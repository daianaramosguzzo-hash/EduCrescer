name: Instalador Windows

# Gera o instalador .exe numa máquina Windows.
# Rode manualmente pela aba Actions ou crie uma tag (ex.: v1.0.1) para publicar numa Release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Crescemon-Brasa-3D-Windows
          path: dist/*.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
