name: Instalador Windows

# Gera o instalador .exe numa máquina Windows.
# Rode manualmente pela aba Actions (publica a Release da versão do package.json)
# ou crie uma tag (ex.: v1.0.1).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Crescemon-Brasa-3D-Windows
          path: dist/*.exe
      - name: Versão do jogo
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publicar na Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.v) }}
          target_commitish: ${{ github.sha }}
          name: Crescemon Brasa 3D ${{ steps.ver.outputs.v }}
          body: |
            Instalador do **Crescemon Brasa 3D** para Windows (64 bits).

            1. Baixe `Crescemon-Brasa-3D-Setup-${{ steps.ver.outputs.v }}.exe` abaixo.
            2. Dê dois cliques para instalar e escolha a pasta.
            3. Se o Windows mostrar "O Windows protegeu o computador", clique em **Mais informações → Executar assim mesmo** (o instalador não é assinado digitalmente).

            O jogo fica no menu Iniciar e na área de trabalho. F11 alterna a tela cheia.
          files: dist/*.exe
